<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboards</title>
<style>/* Shared theme for the landing page and the macro dashboards (eurodollar, rates and credit).
   Tokens match templates/home.html, so the three pages read as one app. */
:root {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-hover: #202020;
  --border: rgba(255, 255, 255, 0.10);
  --border-strong: rgba(255, 255, 255, 0.28);
  --grid: #2c2c2a;
  --text-primary: #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted: #898781;
  --accent: #9085e9;
  --trend: #898781;
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #d03b3b;
  --cool: #5b8dd9;          /* ease / falling: the cool end of the one scale */
  --control: rgba(255, 255, 255, 0.06);
  --control-active: rgba(144, 133, 233, 0.30);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--page); color: var(--text-primary);
  font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: inherit; }
.page { max-width: 1480px; margin: 0 auto; padding: 20px 16px 40px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 20px; font-weight: 650; }
.meta { margin: 2px 0 0; color: var(--text-secondary); font-size: 12px; }
.note { margin: 12px 0 16px; color: var(--text-muted); font-size: 12px; max-width: 980px; }
main { transition: opacity 120ms; }
body.refreshing.loaded main { opacity: 0.7; }

.nav { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { all: unset; cursor: pointer; padding: 5px 11px; border-radius: 6px; background: var(--control);
  color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
.btn:hover { background: var(--surface-hover); color: var(--text-primary); }
.btn:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--control-active); color: var(--text-primary); }
.btn[aria-current="page"] { background: var(--control-active); color: var(--text-primary); }

.message { margin: 0 0 16px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); color: var(--text-secondary); }
.message code { color: var(--text-primary); }
.message.bad { border-color: var(--critical); }

.pill { display: inline-block; padding: 1px 7px; border-radius: 5px; background: var(--control);
  color: var(--text-secondary); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
  white-space: nowrap; }
.pill.good { background: rgba(12, 163, 12, 0.20); color: #7fe07f; }
.pill.warn { background: rgba(250, 178, 25, 0.20); color: #ffd07a; }
.pill.bad { background: rgba(208, 59, 59, 0.24); color: #ff9a9a; }
.pill.proxy { background: rgba(144, 133, 233, 0.22); color: #c9c2ff; }
.pill.stale { background: rgba(250, 178, 25, 0.16); color: #ffd07a; }

.tooltip { position: fixed; z-index: 30; padding: 6px 9px; border: 1px solid var(--border-strong);
  border-radius: 7px; background: #111110; color: var(--text-primary); font-size: 12px;
  pointer-events: none; white-space: nowrap; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5); }

/* ------------------------------------------------------------------ charts */
.chart { position: relative; height: 96px; margin-top: 8px; }
.chart.tall { height: 150px; }
.chart svg { position: absolute; inset: 0 0 16px; width: 100%; height: calc(100% - 16px); overflow: visible; }
.chart-line { fill: none; stroke: var(--trend); stroke-width: 1.5; stroke-linejoin: round;
  vector-effect: non-scaling-stroke; }
.chart-line.stress { stroke: var(--warning); }
.chart-zero { stroke: var(--border-strong); stroke-width: 1; vector-effect: non-scaling-stroke; }
.chart-band { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
.chart-shade { fill: rgba(208, 59, 59, 0.14); }
.chart-empty { margin: 0; padding-top: 28px; color: var(--text-muted); font-size: 12px; text-align: center; }
.chart-dot, .chart-hover { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 2px var(--surface); pointer-events: none; }
.chart-hover { background: var(--text-primary); }
.chart-cross { position: absolute; top: 0; bottom: 16px; width: 1px; background: var(--border-strong);
  pointer-events: none; }
.chart-axis { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; display: flex;
  justify-content: space-between; color: var(--text-muted); font-size: 10px; }
.spark { position: relative; display: inline-block; width: 64px; height: 18px; vertical-align: middle; }
.spark svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.spark-line { fill: none; stroke: var(--trend); stroke-width: 1.2; vector-effect: non-scaling-stroke; }

.curve-chart { height: 210px; }
.curve-chart svg { inset: 0 0 18px; height: calc(100% - 18px); }
.curve-line { fill: none; stroke-width: 2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.curve-now { stroke: var(--accent); }
.curve-3m { stroke: var(--text-muted); stroke-dasharray: 5 3; stroke-width: 1.4; }
.curve-12m { stroke: var(--grid); stroke-dasharray: 2 3; stroke-width: 1.4; }
.curve-point { fill: var(--accent); }
.curve-hit { position: absolute; top: 0; bottom: 18px; width: 18px; margin-left: -9px; cursor: crosshair; }
.curve-chart .chart-axis { height: 16px; }
.curve-tick { position: absolute; transform: translateX(-50%); }

/* ------------------------------------------------------------------ cards */
.panel { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 12px; }
.panel-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.panel-head h2 { margin: 0; font-size: 15px; font-weight: 650; }
.panel-head .asof { margin-left: auto; color: var(--text-muted); font-size: 11px; white-space: nowrap; }
.panel-note { margin: 0; color: var(--text-muted); font-size: 11.5px; }
.panel-objective { margin: 0; color: var(--text-secondary); font-size: 12px; }

.tile-label { color: var(--text-muted); font-size: 11px; }
.tile-value { font-size: 19px; font-weight: 600; line-height: 1.25; white-space: nowrap; }
.tile-change { color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
.tile-value.up { color: #ff9a9a; }
.tile-value.down { color: #9ec1f5; }
.empty { color: var(--text-muted); }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { padding: 5px 8px 5px 0; text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { color: var(--text-muted); font-weight: 500; border-bottom: 1px solid var(--grid); }
tbody tr + tr td { border-top: 1px solid rgba(255, 255, 255, 0.05); }
td.num, th.num { font-variant-numeric: tabular-nums; }
.pos { color: #7fe07f; }
.neg { color: #ff9a9a; }

/* ------------------------------------------------------------------ macro dashboard layout */
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 12px;
  margin: 16px 0; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; }
.strip .tile-note { margin: 2px 0 0; color: var(--text-muted); font-size: 11px; white-space: normal; }
/* align-items: start, so a short panel does not stretch to the tallest in its row. */
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); gap: 12px;
  align-items: start; }
.panels .wide { grid-column: 1 / -1; }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px; }
.metric-row { display: flex; align-items: baseline; gap: 8px; }
.metric-row .tile-value { font-size: 16px; }
.metric-row .tile-label { min-width: 0; flex: 1; }
details { border-top: 1px solid var(--grid); padding-top: 8px; }
details summary { cursor: pointer; color: var(--text-secondary); font-size: 12px; }
details summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
details .body { padding-top: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--text-muted); font-size: 11px; }
.legend i { display: inline-block; width: 14px; height: 0; margin-right: 5px; vertical-align: middle;
  border-top: 2px solid var(--accent); }
.legend .l3m { border-top: 1.4px dashed var(--text-muted); }
.legend .l12m { border-top: 1.4px dotted var(--grid); }
.health td.bad { color: #ff9a9a; }
.summary { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; padding: 14px 18px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
.summary h2 { margin: 0; color: var(--text-muted); font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; }
.summary p { margin: 0; max-width: 90ch; color: var(--text-primary); font-size: 14px; line-height: 1.6;
  text-wrap: pretty; }
.summary .summary-foot { color: var(--text-muted); font-size: 11.5px; line-height: 1.45; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 14px;
    margin-top: 18px; }
  .card { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 18px 20px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; min-height: 190px; }
  .card:hover { background: var(--surface-hover); border-color: var(--border-strong); }
  .card h2 { margin: 0; font-size: 17px; font-weight: 650; }
  .card h2 a { text-decoration: none; }
  .card h2 a::after { content: ""; position: absolute; inset: 0; border-radius: 14px; }
  .card .what { margin: 0; color: var(--text-secondary); font-size: 12.5px; }
  .card .stats { margin-top: auto; display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 12px;
    color: var(--text-secondary); }
  .card .stats b { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }
  .card .state { color: var(--text-muted); font-size: 12px; }
  .card.unready .stats b { color: var(--text-secondary); }
</style>
</head>

<div class="page">
  <header class="head">
    <div>
      <h1>Dashboards</h1>

    </div>

  <main>
    <div class="message" id="message" role="status" hidden></div>
    <section class="cards" id="cards" aria-label="Dashboards"></section>
  </main>
</div>
<div class="tooltip" id="tooltip" hidden></div>

<script>// Shared chart and formatting primitives for the landing page and the two macro
// dashboards (eurodollar, rates and credit). Inlined into each page by server.App.page(), so a page is still a
// single self-contained file with no CDN and no second request.
//
// Everything here is hand-rolled inline SVG, deliberately: the pages have to
// work offline, match the options dashboard visually, and add no dependency to
// a project whose only runtime deps are for fetching and storing data.
'use strict';

const $ = (id) => document.getElementById(id);
const SVG_NS = 'http://www.w3.org/2000/svg';
const MINUS = '−';

function node(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== undefined && text !== null) element.textContent = text;
  return element;
}

function svgNode(tag, attrs) {
  const element = document.createElementNS(SVG_NS, tag);
  for (const [key, value] of Object.entries(attrs || {})) element.setAttribute(key, value);
  return element;
}

const finite = (v) => typeof v === 'number' && Number.isFinite(v);

function signed(value, digits) {
  if (!finite(value)) return '-';
  const size = Math.abs(value).toFixed(digits);
  if (Number(size) === 0) return size;   // never "-0" or "+0" once rounded
  return value < 0 ? `${MINUS}${size}` : `+${size}`;
}

const fmt = {
  pct: (v, digits = 2) => (finite(v) ? `${v.toFixed(digits)}%` : '-'),
  bp: (v) => (finite(v) ? `${signed(v * 100, 0)} bp` : '-'),
  pctChange: (v, digits = 2) => (finite(v) ? `${signed(v, digits)}%` : '-'),
  num: (v, digits = 2) => (finite(v) ? v.toFixed(digits) : '-'),
  signedNum: (v, digits = 2) => (finite(v) ? signed(v, digits) : '-'),
  z: (v) => (finite(v) ? `${signed(v, 1)}σ` : '-'),
  count: (v) => (finite(v) ? v.toLocaleString('en-US') : '-'),
  billions: (v) => (finite(v) ? `$${(v / 1000).toFixed(v >= 10000 ? 0 : 1)}T`.replace('$', '$') : '-'),
  usd: (v, units) => {
    if (!finite(v)) return '-';
    if (units === 'usd_billions') return v >= 1000 ? `$${(v / 1000).toFixed(2)}T` : `$${v.toFixed(v < 10 ? 1 : 0)}B`;
    if (units === 'usd_millions') return v >= 1_000_000 ? `$${(v / 1_000_000).toFixed(2)}T`
      : v >= 1000 ? `$${(v / 1000).toFixed(1)}B` : `$${v.toFixed(0)}M`;
    return v.toLocaleString('en-US');
  },
  day: (iso) => {
    if (!iso) return '-';
    const date = new Date(`${iso}T00:00:00Z`);
    return new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric', year: 'numeric' })
      .format(date);
  },
  // Axis ticks on a multi-year chart. The year is spelled out: "Sep 24" reads as
  // a day of the month, which is exactly the wrong thing on a date axis.
  shortDay: (iso) => {
    if (!iso) return '-';
    return new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', month: 'short', year: 'numeric' })
      .format(new Date(`${iso}T00:00:00Z`));
  },
  // Market time, labelled: a page sent to someone in another zone must not
  // silently show a capture time in theirs.
  when: (iso) => {
    if (!iso) return '-';
    const ms = Date.parse(iso);
    return Number.isNaN(ms) ? iso : `${new Intl.DateTimeFormat('en-US',
      { timeZone: 'America/New_York', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }).format(ms)} ET`;
  },
  ago: (days) => {
    if (!finite(days)) return '';
    if (days <= 0) return 'today';
    if (days === 1) return 'yesterday';
    if (days < 21) return `${days} days ago`;
    if (days < 60) return `${Math.round(days / 7)} weeks ago`;
    return `${Math.round(days / 30.4)} months ago`;
  },
};

// Value formatter chosen by a series' declared units, so no card has to know.
function formatUnits(value, units, digits) {
  if (!finite(value)) return '-';
  if (units === 'percent') return fmt.pct(value, digits ?? 2);
  if (units === 'usd_millions' || usdUnits(units)) return fmt.usd(value, units);
  if (units === 'index') return fmt.num(value, digits ?? 1);
  if (units === 'count') return fmt.count(value);
  return fmt.num(value, digits ?? 4);
}
const usdUnits = (units) => units === 'usd_billions' || units === 'usd_millions';

// --------------------------------------------------------------------- tooltip

function showTooltip(event, lines) {
  const tooltip = $('tooltip');
  if (!tooltip) return;
  tooltip.textContent = '';
  for (const line of [].concat(lines)) tooltip.appendChild(node('div', null, line));
  tooltip.hidden = false;
  const { width, height } = tooltip.getBoundingClientRect();
  const left = Math.min(Math.max(8, event.clientX - width / 2), window.innerWidth - width - 8);
  const top = event.clientY - height - 12;
  tooltip.style.left = `${left}px`;
  tooltip.style.top = `${top < 8 ? event.clientY + 16 : top}px`;
}

function hideTooltip() {
  const tooltip = $('tooltip');
  if (tooltip) tooltip.hidden = true;
}

// --------------------------------------------------------------- time series
//
// One chart covers every time series on the page. Options:
//   zero    draw a zero line (spreads, z-scores: the sign is the whole point)
//   bands   [{value, label}] horizontal threshold lines for the stress bands
//   shade   [{start, end}] shaded date ranges (curve inversions)
//   format  value formatter for the hover readout
//
// Points are [isoDate, value] pairs, oldest first.
function timeSeries(points, options = {}) {
  const box = node('div', `chart${options.tall ? ' tall' : ''}`);
  const values = (points || []).filter((p) => finite(p[1]));
  if (values.length < 2) {
    box.appendChild(node('p', 'chart-empty', options.emptyText || 'Not enough history yet.'));
    return box;
  }
  const times = values.map((p) => Date.parse(`${p[0]}T00:00:00Z`));
  const ys = values.map((p) => p[1]);
  const t0 = times[0];
  const t1 = times[times.length - 1];
  const extras = (options.bands || []).map((b) => b.value).filter(finite);
  let lo = Math.min(...ys, ...(options.zero ? [0] : []), ...extras);
  let hi = Math.max(...ys, ...(options.zero ? [0] : []), ...extras);
  if (hi - lo < 1e-9) { lo -= 0.5; hi += 0.5; }
  const pad = (hi - lo) * 0.08;
  lo -= pad; hi += pad;
  const x = (t) => ((t - t0) / Math.max(t1 - t0, 1)) * 100;
  const y = (v) => ((hi - v) / (hi - lo)) * 100;

  const svg = svgNode('svg', { viewBox: '0 0 100 100', preserveAspectRatio: 'none', 'aria-hidden': 'true' });
  for (const range of options.shade || []) {
    const from = Date.parse(`${range.start}T00:00:00Z`);
    const to = Date.parse(`${range.end}T00:00:00Z`);
    if (!finite(from) || !finite(to) || to < t0 || from > t1) continue;
    const left = x(Math.max(from, t0));
    svg.appendChild(svgNode('rect', { class: 'chart-shade', x: left, y: 0,
      width: Math.max(x(Math.min(to, t1)) - left, 0.4), height: 100 }));
  }
  if (options.zero && lo < 0 && hi > 0) {
    svg.appendChild(svgNode('line', { class: 'chart-zero', x1: 0, x2: 100, y1: y(0), y2: y(0) }));
  }
  for (const band of options.bands || []) {
    if (!finite(band.value) || band.value < lo || band.value > hi) continue;
    svg.appendChild(svgNode('line', { class: 'chart-band', x1: 0, x2: 100, y1: y(band.value), y2: y(band.value) }));
  }
  const path = values.map((p, i) => `${i ? 'L' : 'M'}${x(times[i]).toFixed(3)},${y(p[1]).toFixed(3)}`).join('');
  svg.appendChild(svgNode('path', { class: `chart-line${options.stress ? ' stress' : ''}`, d: path }));
  box.appendChild(svg);

  const dot = node('span', 'chart-dot');
  dot.style.left = '100%';
  dot.style.top = `${y(ys[ys.length - 1])}%`;
  box.appendChild(dot);

  const cross = node('span', 'chart-cross');
  cross.hidden = true;
  const hover = node('span', 'chart-hover');
  hover.hidden = true;
  box.append(cross, hover);

  const format = options.format || ((v) => fmt.num(v, 3));
  box.addEventListener('pointermove', (event) => {
    const rect = box.getBoundingClientRect();
    const at = t0 + ((event.clientX - rect.left) / rect.width) * (t1 - t0);
    let best = 0;
    for (let i = 1; i < times.length; i += 1) {
      if (Math.abs(times[i] - at) < Math.abs(times[best] - at)) best = i;
    }
    cross.hidden = false; hover.hidden = false;
    cross.style.left = `${x(times[best])}%`;
    hover.style.left = `${x(times[best])}%`;
    hover.style.top = `${y(ys[best])}%`;
    showTooltip(event, [format(ys[best]), fmt.day(values[best][0])]);
  });
  box.addEventListener('pointerleave', () => { cross.hidden = true; hover.hidden = true; hideTooltip(); });

  const axis = node('div', 'chart-axis');
  axis.append(node('span', null, fmt.shortDay(values[0][0])), node('span', null, fmt.shortDay(values[values.length - 1][0])));
  box.appendChild(axis);
  return box;
}

// ------------------------------------------------------------------ yield curve
//
// Tenor on the x axis (log-spaced, so the front end is readable), one line per
// baseline curve. This is the one chart the options dashboard has no analogue for.
function curveChart(curves, options = {}) {
  const box = node('div', 'chart curve-chart');
  const sets = Object.entries(curves || {}).filter(([, c]) => c && (c.points || []).length > 1);
  if (!sets.length) {
    box.appendChild(node('p', 'chart-empty', 'No curve data yet.'));
    return box;
  }
  const all = sets.flatMap(([, c]) => c.points);
  const tenors = all.map((p) => p.tenor).filter(finite);
  const ys = all.map((p) => p.value).filter(finite);
  const lx0 = Math.log(Math.min(...tenors));
  const lx1 = Math.log(Math.max(...tenors));
  let lo = Math.min(...ys);
  let hi = Math.max(...ys);
  if (hi - lo < 1e-9) { lo -= 0.5; hi += 0.5; }
  const pad = (hi - lo) * 0.12;
  lo -= pad; hi += pad;
  const x = (tenor) => ((Math.log(tenor) - lx0) / Math.max(lx1 - lx0, 1e-9)) * 100;
  const y = (v) => ((hi - v) / (hi - lo)) * 100;

  const svg = svgNode('svg', { viewBox: '0 0 100 100', preserveAspectRatio: 'none', 'aria-hidden': 'true' });
  sets.forEach(([name, curve]) => {
    const points = curve.points.filter((p) => finite(p.tenor) && finite(p.value))
      .sort((a, b) => a.tenor - b.tenor);
    const d = points.map((p, i) => `${i ? 'L' : 'M'}${x(p.tenor).toFixed(3)},${y(p.value).toFixed(3)}`).join('');
    svg.appendChild(svgNode('path', { class: `curve-line curve-${name}`, d }));
    if (name === 'now') {
      for (const p of points) {
        svg.appendChild(svgNode('circle', { class: 'curve-point', cx: x(p.tenor), cy: y(p.value), r: 1.1 }));
      }
    }
  });
  box.appendChild(svg);

  const current = (curves.now && curves.now.points) || [];
  for (const p of current) {
    if (!finite(p.tenor) || !finite(p.value)) continue;
    const hit = node('span', 'curve-hit');
    hit.style.left = `${x(p.tenor)}%`;
    hit.addEventListener('pointerenter', (event) => {
      const lines = [`${p.label}: ${fmt.pct(p.value)}`];
      for (const [name, curve] of sets) {
        if (name === 'now') continue;
        const match = (curve.points || []).find((q) => q.tenor === p.tenor);
        if (match) lines.push(`${options.labels?.[name] || name}: ${fmt.pct(match.value)} (${signed(p.value - match.value, 2)})`);
      }
      showTooltip(event, lines);
    });
    hit.addEventListener('pointerleave', hideTooltip);
    box.appendChild(hit);
  }

  const axis = node('div', 'chart-axis');
  for (const p of current.filter((q) => finite(q.tenor))) {
    const tick = node('span', 'curve-tick', p.label);
    tick.style.left = `${x(p.tenor)}%`;
    axis.appendChild(tick);
  }
  box.appendChild(axis);
  return box;
}

// A compact inline sparkline for table rows and tiles.
function sparkline(points, options = {}) {
  const box = node('span', 'spark');
  const values = (points || []).filter((p) => finite(p[1]));
  if (values.length < 2) return box;
  const ys = values.map((p) => p[1]);
  let lo = Math.min(...ys, ...(options.zero ? [0] : []));
  let hi = Math.max(...ys, ...(options.zero ? [0] : []));
  if (hi - lo < 1e-9) { lo -= 0.5; hi += 0.5; }
  const svg = svgNode('svg', { viewBox: '0 0 100 100', preserveAspectRatio: 'none', 'aria-hidden': 'true' });
  const d = values.map((p, i) =>
    `${i ? 'L' : 'M'}${((i / (values.length - 1)) * 100).toFixed(2)},${(((hi - p[1]) / (hi - lo)) * 100).toFixed(2)}`
  ).join('');
  svg.appendChild(svgNode('path', { class: 'spark-line', d }));
  box.appendChild(svg);
  return box;
}

// ------------------------------------------------------- cards (macro dashboards)
//
// Shared by the eurodollar monitor and the rates and credit page, so a card,
// a table or the series-health list looks and behaves the same on both.

// Returns a scrollable wrapper around the table: these tables have up to eight
// numeric columns and must not push the page sideways on a phone.
function table(headers, rows, options = {}) {
  const wrap = node('div', 'table-wrap');
  const element = document.createElement('table');
  const thead = element.createTHead().insertRow();
  headers.forEach((text, i) => {
    const th = document.createElement('th');
    th.textContent = text;
    if (i) th.className = 'num';
    thead.appendChild(th);
  });
  const body = element.createTBody();
  for (const row of rows) {
    const tr = body.insertRow();
    row.forEach((value, i) => {
      const td = tr.insertCell();
      if (value && typeof value === 'object' && value.nodeType) td.appendChild(value);
      else td.textContent = value ?? '-';
      if (i) td.className = 'num';
      // An empty class name throws on classList.add, so only apply a real one.
      const extra = options.classes && options.classes[i] && options.classes[i](row, value);
      if (extra) td.classList.add(extra);
    });
  }
  wrap.appendChild(element);
  return wrap;
}

function panel(title, options = {}) {
  const section = node('section', `panel${options.wide ? ' wide' : ''}`);
  const head = node('div', 'panel-head');
  head.appendChild(node('h2', null, title));
  for (const badge of options.badges || []) head.appendChild(badge);
  if (options.asof) head.appendChild(node('span', 'asof', `as of ${fmt.day(options.asof)}`));
  section.appendChild(head);
  if (options.objective) section.appendChild(node('p', 'panel-objective', options.objective));
  return section;
}

function metric(label, summary, options = {}) {
  const box = node('div');
  const row = node('div', 'metric-row');
  row.appendChild(node('span', 'tile-label', label));
  const available = summary && summary.value !== undefined && summary.value !== null;
  const value = node('span', 'tile-value', available
    ? (options.format || ((v) => fmt.pct(v, 2)))(summary.value) : '-');
  if (!available) value.classList.add('empty');
  row.appendChild(value);
  box.appendChild(row);
  if (!available) {
    box.appendChild(node('p', 'panel-note', options.emptyText || 'series unavailable'));
    return box;
  }
  const meta = node('div', 'tile-change');
  if (finite(summary.change)) {
    meta.append(node('span', null, `${(options.changeFormat || fmt.bp)(summary.change)} in ${summary.lookback_days}d`));
  }
  if (finite(summary.zscore)) meta.append(node('span', null, `${finite(summary.change) ? ' · ' : ''}${fmt.z(summary.zscore)}`));
  box.appendChild(meta);
  if (options.chart !== false) {
    box.appendChild(timeSeries(summary.points, {
      zero: options.zero !== false, format: options.format || ((v) => fmt.pct(v, 3)),
      bands: options.bands, shade: options.shade, stress: options.stress,
    }));
  }
  if (options.note) box.appendChild(node('p', 'panel-note', options.note));
  return box;
}

function proxyBadge() { return pill('proxy', 'proxy'); }
function cadenceBadge(cadence) { return cadence && cadence !== 'daily' ? pill(cadence, 'neutral') : null; }

function legendItem(cls, text) {
  const span = node('span');
  const mark = document.createElement('i');
  if (cls !== 'now') mark.className = cls;
  span.append(mark, document.createTextNode(text));
  return span;
}

const signClass = (row, value) => (typeof value === 'string' && value.startsWith('+') ? 'pos'
  : typeof value === 'string' && value.startsWith(MINUS) ? 'neg' : '');

// Per-series freshness, into #health-summary / #health / #health-wrap.
function renderHealth(series) {
  const stale = series.filter((s) => s.stale).length;
  const missing = series.filter((s) => s.missing).length;
  $('health-summary').textContent =
    `Series health — ${series.length} configured, ${missing} with no data, ${stale} stale`;
  $('health-wrap').hidden = false;
  const rows = series.map((s) => {
    const name = node('span');
    name.append(document.createTextNode(`${s.label} `));
    const code = node('code', null, s.series_id);
    code.style.color = 'var(--text-muted)';
    name.appendChild(code);
    if (s.is_proxy) name.appendChild(proxyBadge());
    return [name, s.panel, s.source, s.cadence,
      s.missing ? 'none' : formatUnits(s.value, s.units),
      s.missing ? '-' : `${fmt.day(s.date)} (${fmt.ago(s.age_days)})`,
      fmt.count(s.observations),
      s.missing ? 'no data' : s.stale ? `stale > ${s.stale_after_days}d` : s.history_only ? 'history only' : 'ok'];
  });
  const host = $('health');
  host.textContent = '';
  host.appendChild(table(['Series', 'Panel', 'Source', 'Cadence', 'Latest', 'As of', 'Points', 'State'], rows, {
    classes: { 7: (row, value) => (value === 'ok' || value === 'history only' ? '' : 'bad') },
  }));
}

// A status pill: `tone` drives the colour, one scale across every panel.
function pill(text, tone) {
  return node('span', `pill ${tone || 'neutral'}`, text);
}

// Stress is warm, ease is cool: one mapping for every band name on the page, so
// a red pill means the same thing in every panel.
const TONES = {
  normal: 'good', balanced: 'good', calm: 'good',
  strained: 'warn', tight: 'warn', elevated: 'warn',
  acute: 'bad', extreme: 'bad',
  unknown: 'neutral',
};
const toneFor = (band) => TONES[band] || 'neutral';

async function loadJson(url) {
  const response = await fetch(url, { cache: 'no-store' });
  const body = await response.json();
  if (!response.ok) throw new Error(body.error || response.statusText);
  return body;
}

// The page's own data when `options-db site` wrote it out as a file, else null (served: fetch /api/...).
// {written_out, links: {route: file}, data}; see server.PAGE_PLACEHOLDER.
const EMBEDDED = JSON.parse(document.getElementById('page-data')?.textContent || 'null');

// A written-out page has no server behind it: point each in-app link at the file that was written for it,
// and hide the links whose page was not exported.
function relink(links) {
  document.querySelectorAll('a[href^="/"]').forEach((link) => {
    const to = links[link.getAttribute('href')];
    if (to) link.setAttribute('href', to);
    else link.hidden = true;
  });
}


const REFRESH_MS = 60_000;
let data = null;

const DASHBOARDS = [
  {
    key: 'options',
    title: 'Options DB',
    href: '/options',
    what: 'Intraday option-chain snapshots per ticker, and the 3D implied-volatility surface viewer. '
        + 'Shows how each surface moves over a trading day.',
    stats: (d) => {
      if (!d || !d.ready) return null;
      return [
        ['Tickers collecting', fmt.count(d.active_tickers)],
        ['Last snapshot', d.last_snapshot ? fmt.when(d.last_snapshot) : 'none yet'],
        ['Days stored', fmt.count(d.days)],
      ];
    },
  },
  {
    key: 'eurodollar',
    title: 'Eurodollar System Monitor',
    href: '/eurodollar',
    what: 'The Treasury curve, break-evens, funding spreads and the offshore dollar, read together '
        + 'as one signal about money and growth.',
    stats: (d) => {
      if (!d || !d.ready) return null;
      return [
        ...(d.synthetic ? [['Data', 'synthetic']] : []),   // a simulated regime reads like a real one
        ['10-year', fmt.pct(d.ten_year)],
        ['10Y − 2Y', fmt.pct(d.two_ten)],
        ['As of', fmt.day(d.last_observation)],
      ];
    },
  },
  {
    key: 'rates',
    title: 'Rates & Credit',
    href: '/rates',
    what: 'Forward rates and the policy path the Treasury curve prices, set against credit spreads '
        + 'by rating: what the market expects policy to do, and who it expects to get hurt.',
    stats: (d) => {
      if (!d || !d.ready) return null;
      return [
        ...(d.synthetic ? [['Data', 'synthetic']] : []),
        ['Near-term fwd spread', fmt.bp(d.near_term)],
        ['HY OAS', fmt.pct(d.high_yield)],
        ['Credit', `${d.credit_band || '-'}${d.decompressing ? ', low-rated widening' : ''}`],
        ['As of', fmt.day(d.last_observation)],
      ];
    },
  },
];

function card(spec) {
  const info = (data && data[spec.key]) || null;
  const ready = Boolean(info && info.ready);
  const article = node('article', `card${ready ? '' : ' unready'}`);
  const title = node('h2');
  const link = node('a', null, spec.title);
  link.href = spec.href;
  title.appendChild(link);
  article.appendChild(title);

  if (info && info.regime) {
    const head = node('div');
    head.appendChild(pill(info.regime.label || 'unclassified', regimeTone(info.regime.key)));
    if (finite(info.regime.confidence)) {
      head.appendChild(node('span', 'state', ` confidence ${Math.round(info.regime.confidence * 100)}%`));
    }
    article.appendChild(head);
  }
  article.appendChild(node('p', 'what', spec.what));

  const rows = spec.stats(info);
  const stats = node('div', 'stats');
  if (rows) {
    for (const [label, value] of rows) {
      const span = node('span');
      span.append(node('span', null, `${label} `), node('b', null, value));
      stats.appendChild(span);
    }
  } else {
    stats.appendChild(node('span', 'state', (info && info.message) || 'No data collected yet.'));
  }
  article.appendChild(stats);
  return article;
}

const REGIME_TONES = { expansion: 'good', reflation: 'warn', stagflation: 'warn', deflation: 'bad' };
const regimeTone = (key) => REGIME_TONES[key] || 'neutral';

function render() {
  const cards = $('cards');
  cards.textContent = '';
  for (const spec of DASHBOARDS) cards.appendChild(card(spec));
  $('subtitle').textContent = data && data.generated_at
    ? `${EMBEDDED ? 'Snapshot of' : 'Updated'} ${fmt.when(data.generated_at)}` : 'Three dashboards over this project’s data.';
  if (EMBEDDED) relink(EMBEDDED.links);   // the cards are rebuilt above, so their links are too
}

async function load() {
  document.body.classList.add('refreshing');
  try {
    data = await loadJson('/api/landing');
    $('message').hidden = true;
    render();
    document.body.classList.add('loaded');
  } catch (error) {
    $('message').hidden = false;
    $('message').className = 'message bad';
    $('message').textContent = `Could not load the dashboards: ${error.message}`;
    if (!data) render();
  } finally {
    document.body.classList.remove('refreshing');
  }
}

if (EMBEDDED) {
  data = EMBEDDED.data;
  render();
} else {
  load();
  setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
}
</script>
