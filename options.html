<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Options DB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Options DB — Design System
   Version 0.1.0

   Vendored verbatim from the "Options DB — Design System" style guide
   (claude.ai/artifact/Qu2iU65GC9ASuVdk1Av9qh). Change it there first, then
   re-vendor this file: it is the single source of tokens for both pages, and
   assets.py inlines it into each one.

   Drop-in stylesheet for the options dashboard, the eurodollar monitor, the
   3D surface viewer overlay and the static export.

   Everything is namespaced: tokens are --od-*, classes are .od-*. Nothing
   here styles bare elements except :root and a focus ring, so it can sit
   alongside existing dashboard CSS during migration without a rewrite.

   Theme: light is the base, dark applies on OS preference or by setting
   data-theme on <html>. Force one with <html data-theme="dark"> — which is
   what both dashboards should ship with.

   Fonts: IBM Plex Sans + IBM Plex Mono, with system fallbacks so the app
   still reads correctly offline. Vendor the woff2 files next to three.js
   rather than relying on a CDN the collector host may not reach.
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. Tokens — light
   -------------------------------------------------------------------------- */

:root {
  color-scheme: light;

  /* Surfaces */
  --od-bg:           #F1F3F5;
  --od-bg-sunken:    #E6E9EC;
  --od-panel:        #FFFFFF;
  --od-panel-raised: #FAFBFC;
  --od-panel-inset:  #F4F6F8;

  /* Rules. Hairline is the default divider; strong is reserved for the
     boundary between independent data sources. */
  --od-line:        #DCE1E6;
  --od-line-strong: #BCC6CE;

  /* Text */
  --od-text:       #10181E;
  --od-text-dim:   #566772;
  --od-text-faint: #8496A1;
  --od-text-on-fill: #FFFFFF;

  /* Accent — live state, funding stress, the one thing asking for attention.
     Used sparingly: never for decoration, never on more than one element
     in a viewport. */
  --od-accent:      #B06A00;
  --od-accent-soft: #FDF1DC;

  /* Direction axis */
  --od-up:        #0E8A57;
  --od-up-soft:   #E2F4EC;
  --od-down:      #C13A31;
  --od-down-soft: #FBE9E7;

  /* Volatility axis — deliberately not red/green, so a short-vol row is
     never misread as a bearish one. */
  --od-vol-long:       #5A44C4;
  --od-vol-long-soft:  #EEEAFB;
  --od-vol-short:      #0A7A8C;
  --od-vol-short-soft: #E2F3F6;

  /* Neutral / no view */
  --od-flat:      #6C7C87;
  --od-flat-soft: #ECEFF1;

  /* Epistemic status */
  --od-derived:  #5A6B77;
  --od-proxy:    #8A6D1F;
  --od-stale:    #8496A1;
  --od-hatch:    rgba(138, 109, 31, 0.45);
  --od-null:     #A6B4BD;

  /* Focus */
  --od-focus: #0A7A8C;

  /* Elevation — light theme only; dark uses raised surfaces instead. */
  --od-shadow: 0 1px 2px rgba(16, 24, 30, 0.08), 0 4px 12px rgba(16, 24, 30, 0.05);

  /* Type */
  --od-font-ui:   "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --od-font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, monospace;

  --od-size-micro: 0.6875rem; /* 11px — badge text, axis ticks */
  --od-size-small: 0.75rem;   /* 12px — table body, dense labels */
  --od-size-base:  0.8125rem; /* 13px — UI default */
  --od-size-lede:  0.9375rem; /* 15px — panel intros, callout body */
  --od-size-h3:    1.125rem;  /* 18px */
  --od-size-h2:    1.5rem;    /* 24px */
  --od-size-h1:    2.125rem;  /* 34px */
  --od-size-num:   1.75rem;   /* 28px — headline readouts */

  --od-leading-tight: 1.2;
  --od-leading-data:  1.35;
  --od-leading-body:  1.55;

  --od-tracking-tight: -0.011em;
  --od-tracking-wide:  0.02em;

  /* Space — 4px grid */
  --od-s1: 0.25rem;
  --od-s2: 0.5rem;
  --od-s3: 0.75rem;
  --od-s4: 1rem;
  --od-s5: 1.5rem;
  --od-s6: 2rem;
  --od-s7: 3rem;

  /* Density — row height and cell padding swap together. */
  --od-row-h:    1.625rem;
  --od-cell-y:   0.25rem;
  --od-cell-x:   0.625rem;

  --od-radius:       2px;
  --od-radius-pill:  999px;
  --od-border:       1px;

  --od-ease: cubic-bezier(0.2, 0, 0.13, 1);
  --od-dur:  120ms;
}

/* --------------------------------------------------------------------------
   2. Tokens — dark
   -------------------------------------------------------------------------- */

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;

    --od-bg:           #0A1117;
    --od-bg-sunken:    #060C11;
    --od-panel:        #101A21;
    --od-panel-raised: #17232C;
    --od-panel-inset:  #0C151B;

    --od-line:        #1E2C36;
    --od-line-strong: #31434F;

    --od-text:       #DBE5EB;
    --od-text-dim:   #8DA1AE;
    --od-text-faint: #5E7381;
    --od-text-on-fill: #0A1117;

    --od-accent:      #F0A93C;
    --od-accent-soft: #2A2013;

    --od-up:        #3ECF8E;
    --od-up-soft:   #0F2A21;
    --od-down:      #F0665E;
    --od-down-soft: #2C1614;

    --od-vol-long:       #9B87F5;
    --od-vol-long-soft:  #1D1934;
    --od-vol-short:      #2FB8CC;
    --od-vol-short-soft: #0C2730;

    --od-flat:      #7C909D;
    --od-flat-soft: #16212A;

    --od-derived:  #8DA1AE;
    --od-proxy:    #D9A84A;
    --od-stale:    #5E7381;
    --od-hatch:    rgba(217, 168, 74, 0.35);
    --od-null:     #4C606D;

    --od-focus: #5FD3E8;

    --od-shadow: none;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;

  --od-bg:           #0A1117;
  --od-bg-sunken:    #060C11;
  --od-panel:        #101A21;
  --od-panel-raised: #17232C;
  --od-panel-inset:  #0C151B;

  --od-line:        #1E2C36;
  --od-line-strong: #31434F;

  --od-text:       #DBE5EB;
  --od-text-dim:   #8DA1AE;
  --od-text-faint: #5E7381;
  --od-text-on-fill: #0A1117;

  --od-accent:      #F0A93C;
  --od-accent-soft: #2A2013;

  --od-up:        #3ECF8E;
  --od-up-soft:   #0F2A21;
  --od-down:      #F0665E;
  --od-down-soft: #2C1614;

  --od-vol-long:       #9B87F5;
  --od-vol-long-soft:  #1D1934;
  --od-vol-short:      #2FB8CC;
  --od-vol-short-soft: #0C2730;

  --od-flat:      #7C909D;
  --od-flat-soft: #16212A;

  --od-derived:  #8DA1AE;
  --od-proxy:    #D9A84A;
  --od-stale:    #5E7381;
  --od-hatch:    rgba(217, 168, 74, 0.35);
  --od-null:     #4C606D;

  --od-focus: #5FD3E8;

  --od-shadow: none;
}

/* Density: comfortable is the default above; compact is for chain tables
   and anything with more than ~20 rows on screen. */
:root[data-density="compact"] {
  --od-row-h:  1.375rem;
  --od-cell-y: 0.125rem;
  --od-cell-x: 0.5rem;
}

/* --------------------------------------------------------------------------
   3. Base
   -------------------------------------------------------------------------- */

.od-root {
  background: var(--od-bg);
  color: var(--od-text);
  font-family: var(--od-font-ui);
  font-size: var(--od-size-base);
  line-height: var(--od-leading-body);
  -webkit-font-smoothing: antialiased;
}

.od-root *,
.od-root *::before,
.od-root *::after { box-sizing: border-box; }

:where(.od-root) :focus-visible {
  outline: 2px solid var(--od-focus);
  outline-offset: 2px;
  border-radius: var(--od-radius);
}

/* --------------------------------------------------------------------------
   4. Type
   -------------------------------------------------------------------------- */

.od-h1 { font-size: var(--od-size-h1); line-height: var(--od-leading-tight); letter-spacing: var(--od-tracking-tight); font-weight: 600; margin: 0; }
.od-h2 { font-size: var(--od-size-h2); line-height: var(--od-leading-tight); letter-spacing: var(--od-tracking-tight); font-weight: 600; margin: 0; }
.od-h3 { font-size: var(--od-size-h3); line-height: var(--od-leading-tight); font-weight: 600; margin: 0; }

.od-body  { font-size: var(--od-size-base); max-width: 68ch; margin: 0; }
.od-lede  { font-size: var(--od-size-lede); line-height: var(--od-leading-body); color: var(--od-text-dim); max-width: 68ch; margin: 0; }
.od-small { font-size: var(--od-size-small); color: var(--od-text-dim); margin: 0; }
.od-micro { font-size: var(--od-size-micro); color: var(--od-text-faint); letter-spacing: var(--od-tracking-wide); margin: 0; }

/* Numbers. Tabular figures everywhere, so columns align and a changing
   value doesn't reflow the row. */
.od-n {
  font-family: var(--od-font-data);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "zero" 1;
  letter-spacing: 0;
}

.od-n-lg {
  font-family: var(--od-font-data);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "zero" 1;
  font-size: var(--od-size-num);
  line-height: var(--od-leading-tight);
  font-weight: 500;
}

/* Unit suffixes sit quieter than the figure they qualify. */
.od-unit { color: var(--od-text-faint); font-size: 0.8em; margin-left: 0.15em; }

/* --------------------------------------------------------------------------
   5. Semantic value colouring

   Two independent axes. Direction uses the conventional green/red; vol uses
   violet/teal so the two never collide in one row.
   -------------------------------------------------------------------------- */

.od-up        { color: var(--od-up); }
.od-down      { color: var(--od-down); }
.od-vol-long  { color: var(--od-vol-long); }
.od-vol-short { color: var(--od-vol-short); }
.od-flat      { color: var(--od-flat); }
.od-live      { color: var(--od-accent); }

/* Signed deltas. The sign comes from data-sign, never from the colour class —
   a value can be negative and long-vol at the same time, and the two must not
   fight over one selector. */
.od-delta::before { content: "+"; }
.od-delta[data-sign="-"]::before { content: "\2212"; } /* true minus, aligns in mono */
.od-delta[data-sign="0"]::before { content: "\00B7"; }

/* --------------------------------------------------------------------------
   6. Epistemic status

   The system's core idea: how a number is known is as visible as the number.
     measured  — observed and stored (default, no treatment)
     derived   — computed on read from stored observations
     proxy     — a stand-in for data we do not license
     stale     — real, but older than its expected refresh
     null      — insufficient history; shown as an em dash, never a zero
   -------------------------------------------------------------------------- */

.od-derived {
  text-decoration: underline dotted;
  text-decoration-color: var(--od-derived);
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
  cursor: help;
}

.od-proxy {
  color: var(--od-proxy);
  background-image: repeating-linear-gradient(
    135deg,
    transparent 0 3px,
    var(--od-hatch) 3px 4px
  );
  padding-inline: 0.2em;
  border-radius: var(--od-radius);
}

.od-stale {
  color: var(--od-stale);
  text-decoration: line-through;
  text-decoration-color: color-mix(in srgb, var(--od-stale) 55%, transparent);
  text-decoration-thickness: 1px;
}

.od-null {
  color: var(--od-null);
  font-family: var(--od-font-data);
}
.od-null::after { content: "\2014"; } /* em dash — the only empty value */

/* Whole panels can carry a status. Keeps the hatch off every cell. */
.od-panel[data-status="proxy"]  { border-color: color-mix(in srgb, var(--od-proxy) 45%, var(--od-line)); }
.od-panel[data-status="stale"]  { opacity: 0.72; }

/* --------------------------------------------------------------------------
   7. Panels
   -------------------------------------------------------------------------- */

.od-panel {
  background: var(--od-panel);
  border: var(--od-border) solid var(--od-line);
  border-radius: var(--od-radius);
  box-shadow: var(--od-shadow);
  overflow: clip;
}

.od-panel-head {
  display: flex;
  align-items: baseline;
  gap: var(--od-s2);
  padding: var(--od-s2) var(--od-s3);
  border-bottom: var(--od-border) solid var(--od-line);
  background: var(--od-panel-raised);
}

.od-panel-title {
  font-size: var(--od-size-small);
  font-weight: 600;
  letter-spacing: var(--od-tracking-wide);
  margin: 0;
}

/* Timestamp / source, pushed right. Every panel should carry one. */
.od-panel-meta {
  margin-left: auto;
  font-family: var(--od-font-data);
  font-size: var(--od-size-micro);
  color: var(--od-text-faint);
}

.od-panel-body { padding: var(--od-s3); }
.od-panel-body--flush { padding: 0; }

/* Dashboard grid. Panels declare their own span. */
.od-grid {
  display: grid;
  gap: var(--od-s3);
  grid-template-columns: repeat(12, minmax(0, 1fr));
}
.od-span-3  { grid-column: span 3; }
.od-span-4  { grid-column: span 4; }
.od-span-6  { grid-column: span 6; }
.od-span-8  { grid-column: span 8; }
.od-span-12 { grid-column: span 12; }

@media (max-width: 900px) {
  .od-grid > [class*="od-span-"] { grid-column: span 12; }
}

/* --------------------------------------------------------------------------
   8. Readouts — one headline number with its context
   -------------------------------------------------------------------------- */

.od-readout { display: flex; flex-direction: column; gap: var(--od-s1); }
.od-readout-label { font-size: var(--od-size-micro); color: var(--od-text-dim); letter-spacing: var(--od-tracking-wide); }
.od-readout-value { font-family: var(--od-font-data); font-variant-numeric: tabular-nums; font-size: var(--od-size-num); line-height: 1.1; font-weight: 500; }
.od-readout-note  { font-size: var(--od-size-micro); color: var(--od-text-faint); font-family: var(--od-font-data); }

/* --------------------------------------------------------------------------
   9. Tables
   -------------------------------------------------------------------------- */

.od-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--od-size-small);
  line-height: var(--od-leading-data);
}

.od-table th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--od-panel-raised);
  text-align: left;
  font-weight: 600;
  font-size: var(--od-size-micro);
  color: var(--od-text-dim);
  letter-spacing: var(--od-tracking-wide);
  padding: var(--od-cell-y) var(--od-cell-x);
  border-bottom: var(--od-border) solid var(--od-line-strong);
  white-space: nowrap;
}

.od-table td {
  height: var(--od-row-h);
  padding: var(--od-cell-y) var(--od-cell-x);
  border-bottom: var(--od-border) solid var(--od-line);
  white-space: nowrap;
}

/* Numeric columns right-align and go mono. Mark the cell, not the column,
   so a null or a proxy still lands in the right place. */
.od-table td.od-num,
.od-table th.od-num {
  text-align: right;
  font-family: var(--od-font-data);
  font-variant-numeric: tabular-nums;
}

.od-table tbody tr:hover td { background: var(--od-panel-inset); }
.od-table tbody tr[aria-selected="true"] td { background: var(--od-accent-soft); }

/* Group boundary: a heavier rule where an independent source begins. */
.od-table tr.od-group td { border-top: var(--od-border) solid var(--od-line-strong); }

/* Wide tables scroll inside their panel, never the page. */
.od-scroll-x { overflow-x: auto; }

/* --------------------------------------------------------------------------
   10. Badges
   -------------------------------------------------------------------------- */

.od-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.3em;
  padding: 0.1em 0.45em;
  border: var(--od-border) solid currentColor;
  border-radius: var(--od-radius);
  font-size: var(--od-size-micro);
  font-weight: 600;
  line-height: 1.5;
  letter-spacing: var(--od-tracking-wide);
  white-space: nowrap;
}

.od-badge--up        { color: var(--od-up);        background: var(--od-up-soft); }
.od-badge--down      { color: var(--od-down);      background: var(--od-down-soft); }
.od-badge--vol-long  { color: var(--od-vol-long);  background: var(--od-vol-long-soft); }
.od-badge--vol-short { color: var(--od-vol-short); background: var(--od-vol-short-soft); }
.od-badge--flat      { color: var(--od-flat);      background: var(--od-flat-soft); }
.od-badge--live      { color: var(--od-accent);    background: var(--od-accent-soft); }

.od-badge--proxy {
  color: var(--od-proxy);
  background-image: repeating-linear-gradient(135deg, transparent 0 3px, var(--od-hatch) 3px 4px);
}

.od-badge--derived {
  color: var(--od-derived);
  border-style: dashed;
  background: transparent;
}

/* Live dot for the collector heartbeat. Respects reduced motion below. */
.od-dot {
  width: 6px;
  height: 6px;
  border-radius: var(--od-radius-pill);
  background: currentColor;
  flex: none;
}
.od-dot--pulse { animation: od-pulse 2.4s var(--od-ease) infinite; }

@keyframes od-pulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.35; }
}

/* --------------------------------------------------------------------------
   11. Regime card — the call, plus the per-dimension scoring behind it
   -------------------------------------------------------------------------- */

.od-regime { display: flex; flex-direction: column; gap: var(--od-s3); }

.od-regime-call {
  display: flex;
  align-items: baseline;
  gap: var(--od-s2);
  font-size: var(--od-size-h3);
  font-weight: 600;
}

.od-dims { display: grid; gap: var(--od-s2); }

.od-dim {
  display: grid;
  grid-template-columns: 9rem 1fr 3.5rem;
  align-items: center;
  gap: var(--od-s2);
  font-size: var(--od-size-micro);
}

.od-dim-label { color: var(--od-text-dim); }

/* Signed bar: centred at zero, fills left or right. */
.od-dim-bar {
  position: relative;
  height: 4px;
  background: var(--od-panel-inset);
  border-radius: var(--od-radius);
}
.od-dim-bar::before {
  content: "";
  position: absolute;
  inset-block: 0;
  left: 50%;
  width: 1px;
  background: var(--od-line-strong);
}
.od-dim-fill {
  position: absolute;
  inset-block: 0;
  background: currentColor;
  border-radius: var(--od-radius);
}

.od-dim-score { text-align: right; font-family: var(--od-font-data); font-variant-numeric: tabular-nums; }

/* --------------------------------------------------------------------------
   12. Contradicting evidence

   Never an answer with the doubt stripped off. Deliberately not styled as a
   warning — it is part of the reading, not an error.
   -------------------------------------------------------------------------- */

.od-contra {
  border-left: 2px solid var(--od-line-strong);
  padding: var(--od-s2) var(--od-s3);
  background: var(--od-panel-inset);
  font-size: var(--od-size-small);
  color: var(--od-text-dim);
  border-radius: 0 var(--od-radius) var(--od-radius) 0;
}
.od-contra-label {
  display: block;
  font-size: var(--od-size-micro);
  font-weight: 600;
  color: var(--od-text);
  margin-bottom: 0.2em;
}

/* Empty state: an invitation, not an apology. */
.od-empty {
  padding: var(--od-s5) var(--od-s3);
  text-align: center;
  color: var(--od-text-faint);
  font-size: var(--od-size-small);
}

/* --------------------------------------------------------------------------
   13. Controls
   -------------------------------------------------------------------------- */

.od-btn {
  display: inline-flex;
  align-items: center;
  gap: var(--od-s2);
  height: 1.75rem;
  padding: 0 var(--od-s3);
  font: inherit;
  font-size: var(--od-size-small);
  color: var(--od-text);
  background: var(--od-panel-raised);
  border: var(--od-border) solid var(--od-line-strong);
  border-radius: var(--od-radius);
  cursor: pointer;
  transition: background var(--od-dur) var(--od-ease), border-color var(--od-dur) var(--od-ease);
}
.od-btn:hover { background: var(--od-panel-inset); border-color: var(--od-text-faint); }
.od-btn[aria-pressed="true"] { color: var(--od-accent); border-color: currentColor; background: var(--od-accent-soft); }
.od-btn:disabled { color: var(--od-text-faint); cursor: not-allowed; opacity: 0.6; }

.od-input,
.od-select {
  height: 1.75rem;
  padding: 0 var(--od-s2);
  font: inherit;
  font-size: var(--od-size-small);
  font-family: var(--od-font-data);
  color: var(--od-text);
  background: var(--od-panel-inset);
  border: var(--od-border) solid var(--od-line-strong);
  border-radius: var(--od-radius);
}

/* Segmented control — tiers, horizons, theme. */
.od-seg { display: inline-flex; border: var(--od-border) solid var(--od-line-strong); border-radius: var(--od-radius); overflow: clip; }
.od-seg .od-btn { border: 0; border-radius: 0; background: transparent; }
.od-seg .od-btn + .od-btn { border-left: var(--od-border) solid var(--od-line-strong); }

/* Toolbar sits above a panel body, never inside the head. */
.od-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--od-s2);
  padding: var(--od-s2) var(--od-s3);
  border-bottom: var(--od-border) solid var(--od-line);
}

/* --------------------------------------------------------------------------
   14. Sparklines

   One implementation, shared by home.html and the macro panels. Colour comes
   from the axis class on the wrapper; the SVG itself stays neutral.
   Markup: <span class="od-spark od-up"><svg viewBox="0 0 100 24" …>
             <polyline class="od-spark-line" points="…"/>

  #note { margin: var(--od-s4) 0 var(--od-s4); }
  main { transition: opacity var(--od-dur) var(--od-ease); }
  body.refreshing.loaded main { opacity: 0.7; }

  /* Health of the collector: a third axis, neither direction nor volatility.

  .od-badge--alert { color: var(--od-down); background: var(--od-down-soft); }

  /* Flash and setup messages. The system styles contradicting evidence, not
     errors, so these reuse .od-contra's rule-on-the-left form. */
  .message { margin-bottom: var(--od-s4); }
  .message.bad  { border-left-color: var(--od-down); }
  .message.good { border-left-color: var(--od-up); }
  .message code { font-family: var(--od-font-data); color: var(--od-text); }

  .foot .actions { margin: var(--od-s1) 0 0; }
  td .actions { margin: 0; }

  dialog { width: min(420px, calc(100vw - 32px)); padding: var(--od-s4) var(--od-s5) var(--od-s3);

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const REFRESH_MS = 60_000;
const MINUS = '−';
// Collector health, a page-local axis: how the last snapshot went, not a market view.
const STATUS = {
  ok:      { badge: 'od-badge--flat', label: 'ok' },
  partial: { badge: 'od-badge--flat', label: 'partial' },
  failed:  { badge: 'od-badge--alert', label: 'failed' },
  empty:   { badge: 'od-badge--flat', label: 'empty' },
};
const SOURCE_LABEL = { yfinance: 'yfinance snapshots', synthetic: 'synthetic data' };

// null when options-db serve sends the page (it loads /api/tickers and keeps refreshing); the data itself when
// options-db site wrote the page out as a file: a snapshot, with no server to refresh from or edit through.
const EMBEDDED = JSON.parse(document.getElementById('home-data').textContent);
const STATIC = Boolean(EMBEDDED?.written_out);
let data = EMBEDDED;
let view = 'cards';
try { view = localStorage.getItem('options-db-home-view') === 'table' ? 'table' : 'cards'; } catch { /* storage blocked */ }

// ------------------------------------------------------------------ formatting
let timeFormat = null;
let tzLabel = '';
const dayFormat = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric' });
const shortDayFormat = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric' });
let localDateFormat = null;

function setTimezone(zone) {
  timeFormat = new Intl.DateTimeFormat('en-US', { timeZone: zone, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  localDateFormat = new Intl.DateTimeFormat('en-CA', { timeZone: zone, year: 'numeric', month: '2-digit', day: '2-digit' });
  tzLabel = zone === 'America/New_York' ? 'ET' : zone;
}

const finite = (v) => typeof v === 'number' && Number.isFinite(v);
function signed(v, digits) {
  const size = Math.abs(v).toFixed(digits);
  return `${Number(size) === 0 ? '' : v > 0 ? '+' : MINUS}${size}`;
}
const fmt = {
  price: (v) => (finite(v) ? v.toFixed(2) : '-'),
  pct: (v) => (finite(v) ? `${(v * 100).toFixed(2)}%` : '-'),
  pts: (v) => (finite(v) ? signed(v * 100, 2) : '-'),
  ratio: (v) => (finite(v) ? signed(v, 2) : '-'),
  count: (v) => (finite(v) ? v.toLocaleString('en-US') : '-'),
  day: (iso) => dayFormat.format(new Date(`${iso}T00:00:00Z`)),
  // HH:MM when the time falls on `day` (YYYY-MM-DD, market time zone), otherwise the date comes first.
  when: (iso, day, zone = true) => {
    const ms = Date.parse(iso);
    const local = localDateFormat.format(ms);
    const date = local === day ? '' : `${shortDayFormat.format(new Date(`${local}T00:00:00Z`))} `;
    return `${date}${timeFormat.format(ms)}${zone ? ` ${tzLabel}` : ''}`;
  },
};

// The design system's two colour axes. Direction keeps green/red; volatility
// gets violet/teal, so a vol expansion is never read as a rally.
const dirAxis = (v) => (finite(v) && v ? (v > 0 ? 'od-up' : 'od-down') : 'od-flat');
const volAxis = (v) => (finite(v) && v ? (v > 0 ? 'od-vol-long' : 'od-vol-short') : 'od-flat');

// Written out, each ticker carries the file its newest day went to (href); served, the viewer picks the day.
const viewerUrl = (ticker) => ticker.href ?? `/viewer?ticker=${encodeURIComponent(ticker.symbol)}`;
const hasViewer = (ticker) => Boolean(STATIC ? ticker.href : ticker.day);

function node(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text != null) element.textContent = text;
  return element;
}

const text = (value) => document.createTextNode(value);

/** A signed figure: the sign comes from data-sign so the colour class stays free. */
function delta(value, digits, axis, unit) {
  const span = node('span', `od-delta${axis ? ` ${axis}` : ''}`);
  const size = Math.abs(value).toFixed(digits);
  span.dataset.sign = Number(size) === 0 ? '0' : value < 0 ? '-' : '+';
  span.append(text(size));
  if (unit) span.append(node('span', `od-unit${unit === '%' ? '' : ' word'}`, unit));
  return span;
}

/** An em dash, the only empty value the system allows. */
const nothing = () => node('span', 'od-null');

function badge(className, label, dot) {
  const span = node('span', `od-badge ${className}`);
  if (dot) span.append(node('span', `od-dot${dot === 'pulse' ? ' od-dot--pulse' : ''}`));
  span.append(text(label));
  return span;
}

// ------------------------------------------------------------------ tiles
// `axis` colours the change (and the sparkline): spot moves on the direction
// axis, ATM IV on the volatility axis, and RR25 on direction because a
// negative risk reversal is downside demand, not vol expansion.
const TILES = [
  {
    key: 'spot', label: () => 'Spot', derived: false, axis: dirAxis,
    value: (v) => [v.toFixed(2), ''],
    range: fmt.price,
    change: (t) => {
      const points = t.now - t.open;
      return [delta(points, 2, dirAxis(points)), text(' ('), delta((t.now / t.open - 1) * 100, 2, dirAxis(points)), text('%)')];
    },
  },
  {
    key: 'atm', label: (days) => `${days}-day ATM IV`, derived: true, axis: volAxis,
    value: (v) => [(v * 100).toFixed(2), '%'],
    range: fmt.pct,
    change: (t) => [delta((t.now - t.open) * 100, 2, volAxis(t.now - t.open), 'pts')],
  },
  {
    key: 'rr25', label: (days) => `${days}-day RR25`, derived: true, axis: dirAxis, signedValue: true,
    value: (v) => [(v * 100).toFixed(2), 'pts'],
    range: fmt.pts,
    change: (t) => [delta((t.now - t.open) * 100, 2, dirAxis(t.now - t.open), 'pts')],
  },
];

/** A tile's value as plain text, for the sparkline's tooltip and aria-label. */
function plain(tile, v) {
  const [figure, unit] = tile.value(v);
  return unit === '%' ? `${figure}%` : unit ? `${figure} ${unit}` : figure;
}

// ------------------------------------------------------------------ sparkline
function sparkline(track, session, format, name, axis) {
  const box = node('span', `od-spark spark ${axis}`);
  const points = track.points.map(([t, v]) => ({ t: Date.parse(t), v }));
  let t0 = session ? Date.parse(session.open) : points[0].t;
  let t1 = session ? Date.parse(session.close) : points[points.length - 1].t;
  t0 = Math.min(t0, points[0].t);
  t1 = Math.max(t1, points[points.length - 1].t, t0 + 60_000);
  const flat = track.high === track.low;
  const x = (t) => ((t - t0) / (t1 - t0)) * 100;
  const y = (v) => (flat ? 50 : 8 + (1 - (v - track.low) / (track.high - track.low)) * 84);  // percent of the box height

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 100 100');
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.setAttribute('aria-hidden', 'true');
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('class', 'od-spark-line');
  path.setAttribute('d', points.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(2)},${y(p.v).toFixed(2)}`).join(''));
  svg.append(path);
  const place = (element, p) => { element.style.left = `${x(p.t)}%`; element.style.top = `${y(p.v)}%`; };
  const dot = node('span', 'spark-dot');
  place(dot, points[points.length - 1]);
  const cross = node('span', 'spark-cross');
  const hover = node('span', 'spark-hover');
  cross.hidden = true;
  hover.hidden = true;
  box.append(svg, dot, cross, hover);
  box.setAttribute('role', 'img');
  box.setAttribute('aria-label', `${name} through the day: first ${format(track.open)}, low ${format(track.low)}, high ${format(track.high)}, last ${format(track.now)}`);

  box.addEventListener('pointermove', (event) => {
    const rect = box.getBoundingClientRect();
    const at = t0 + ((event.clientX - rect.left) / rect.width) * (t1 - t0);
    const nearest = points.reduce((best, p) => (Math.abs(p.t - at) < Math.abs(best.t - at) ? p : best), points[0]);
    cross.style.left = `${x(nearest.t)}%`;
    place(hover, nearest);
    cross.hidden = false;
    hover.hidden = false;
    showTooltip(event, format(nearest.v), `${name} at ${timeFormat.format(nearest.t)} ${tzLabel}`);
  });
  box.addEventListener('pointerleave', () => { cross.hidden = true; hover.hidden = true; hideTooltip(); });
  return box;
}

/** No history for this measure: a flat dashed rule, never an invented line. */
function nullSparkline() {
  const box = node('span', 'od-spark od-spark--null spark');
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 100 100');
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.setAttribute('aria-hidden', 'true');
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  line.setAttribute('class', 'od-spark-line');
  line.setAttribute('d', 'M0,50L100,50');
  svg.append(line);
  box.append(svg);
  return box;
}

function showTooltip(event, value, when) {
  const tooltip = $('tooltip');
  tooltip.replaceChildren(node('div', 'value od-n', value), node('div', 'when', when));
  tooltip.hidden = false;
  const { width, height } = tooltip.getBoundingClientRect();
  tooltip.style.left = `${Math.max(8, Math.min(event.clientX + 14, innerWidth - width - 8))}px`;
  tooltip.style.top = `${Math.max(8, Math.min(event.clientY + 14, innerHeight - height - 8))}px`;
}
function hideTooltip() { $('tooltip').hidden = true; }

// ------------------------------------------------------------------ cards
function card(ticker) {
  const linked = hasViewer(ticker);
  const article = node('article', `od-panel ticker${linked ? ' linked' : ''}${ticker.active ? '' : ' inactive'}`);

  const head = node('div', 'od-panel-head card-head');
  const title = node('h2', 'od-h3');
  if (linked) {
    const link = node('a', null, ticker.symbol);
    link.href = viewerUrl(ticker);
    link.title = `Open the ${ticker.symbol} IV surface`;
    title.append(link);
  } else {
    title.textContent = ticker.symbol;
  }
  head.append(title, badge('od-badge--flat', ticker.type));
  if (!ticker.active) head.append(badge('od-badge--flat', 'inactive'));

  const last = ticker.last_snapshot;
  const status = node('span', 'status');
  if (last) {
    const state = STATUS[last.status] ?? STATUS.empty;
    // Collecting right now: the accent and a pulsing dot, the system's live state.
    const live = data.market_open && ticker.active && last.status !== 'failed';
    status.append(live ? badge('od-badge--live', state.label, 'pulse') : badge(state.badge, state.label, true));
    status.append(node('span', 'od-panel-meta', fmt.when(last.captured_at_utc, localDateFormat.format(Date.now()))));
    if (last.error) status.title = last.error;
  } else {
    status.append(badge(STATUS.empty.badge, 'no snapshots'));
  }
  head.append(status);
  article.append(head);

  const body = node('div', 'od-panel-body');
  article.append(body);
  if (ticker.notes) body.append(node('p', 'od-small notes', ticker.notes));

  if (!linked) {
    body.append(node('div', 'od-empty', 'No snapshots stored yet. The next collector run fills this in.'), footer(ticker));
    return article;
  }

  const tiles = node('div', 'tiles');
  for (const tile of TILES) {
    const track = ticker[tile.key];
    const label = tile.label(data.target_days);
    const box = node('div', 'od-readout');
    box.append(node('span', 'od-readout-label', label));

    if (!track) {
      const missing = node('span', 'od-readout-value');
      missing.append(nothing());
      box.append(missing, node('span', 'od-readout-note', 'no history yet'), nullSparkline());
      tiles.append(box);
      continue;
    }

    const axis = tile.axis(track.now - track.open);
    const [figure, unit] = tile.value(track.now);
    const value = node('span', `od-readout-value${tile.derived ? ' od-derived' : ''}`);
    if (tile.signedValue) {
      value.append(delta(Number(figure), 2, dirAxis(track.now), unit));
    } else {
      value.append(text(figure));
      if (unit) value.append(node('span', `od-unit${unit === '%' ? '' : ' word'}`, unit));
    }
    if (tile.derived) value.title = 'Derived from the smile fitted to stored bid/ask mids';
    box.append(value, node('span', 'od-readout-note', ''));
    box.lastChild.append(...tile.change(track));

    const spark = sparkline(track, ticker.session, (v) => plain(tile, v), label, axis);
    if (linked) spark.addEventListener('click', () => { location.href = viewerUrl(ticker); });
    box.append(spark, node('span', 'od-readout-note', `${tile.range(track.low)} to ${tile.range(track.high)}`));
    tiles.append(box);
  }
  body.append(tiles);

  const facts = node('div', 'facts');
  facts.append(badge('od-badge--derived', 'Derived'));
  const fact = (name, title, value) => {
    const span = node('span');
    const abbr = node('abbr', null, name);
    abbr.title = title;
    span.append(abbr, text(' '), node('b', null, value));
    facts.append(span);
  };
  const now = (key) => ticker[key]?.now;
  fact('RR25/ATM', 'Risk reversal as a fraction of ATM IV: skew relative to the vol level', fmt.ratio(now('rr25_atm')));
  fact('BF25', 'Butterfly: average 25-delta IV minus ATM IV, in vol points', `${fmt.pts(now('bf25'))} pts`);
  fact('RR10', '10-delta call IV minus 10-delta put IV, in vol points', `${fmt.pts(now('rr10'))} pts`);
  body.append(facts, footer(ticker));
  return article;
}

function footer(ticker) {
  const foot = node('div', 'foot');
  const tiers = node('ul', 'tiers');
  const nowMs = Date.parse(data.generated_at);
  const reference = ticker.day ?? localDateFormat.format(nowMs);
  tiers.setAttribute('aria-label', `Last poll per tier, ${tzLabel}`);
  tiers.append(node('li', null, `Last poll (${tzLabel})`));
  for (const tier of ticker.tiers) {
    const item = node('li');
    item.append(node('span', 'name', tier.name));
    if (!tier.last_poll) {
      item.append(nothing());
      item.title = `${tier.name} tier, polled every ${tier.interval_minutes} min; never polled`;
    } else {
      // Past its refresh window: the system's stale treatment, not a warning icon.
      const late = data.market_open && ticker.active
        && nowMs - Date.parse(tier.last_poll) > (tier.interval_minutes + 5) * 60_000;
      const when = node('time', late ? 'od-stale' : null, fmt.when(tier.last_poll, reference, false));
      when.dateTime = tier.last_poll;
      item.append(when);
      item.title = `${tier.name} tier, polled every ${tier.interval_minutes} min`
        + (late ? `; last poll is more than ${tier.interval_minutes + 5} min old` : '');
    }
    tiers.append(item);
  }
  foot.append(tiers);
  if (ticker.stored) {
    const s = ticker.stored;
    const line = node('div');
    line.append(text(`Stored ${fmt.day(ticker.day)}: `), node('span', 'od-n', fmt.count(s.snapshots)), text(' snapshots · '),
      node('span', 'od-n', fmt.count(s.expirations)), text(' expirations · '),
      node('span', 'od-n', fmt.count(s.quotes)), text(' quotes'));
    if (s.problems) line.append(text(' · '), node('span', 'od-n', fmt.count(s.problems)), text(' partial or failed'));
    foot.append(line);
  }
  if (!STATIC) foot.append(actions(ticker));
  return foot;
}

// ------------------------------------------------------------------ editing config/tickers.yaml
function actions(ticker) {
  const row = node('div', 'actions');
  const toggle = node('button', 'od-btn', ticker.active ? 'Disable' : 'Enable');
  toggle.type = 'button';
  toggle.title = ticker.active
    ? `Stop collecting ${ticker.symbol}, keeping it in the config`
    : `Collect ${ticker.symbol} again from the next wake-up`;
  toggle.addEventListener('click', () => run(toggle, () =>
    change('POST', tickerUrl(ticker.symbol), { active: !ticker.active })));

  const remove = node('button', 'od-btn danger', 'Remove');
  remove.type = 'button';
  remove.title = `Remove ${ticker.symbol} from the config; stored snapshots are kept`;
  remove.addEventListener('click', () => {
    if (!confirm(`Remove ${ticker.symbol} from the config?\n\nStored snapshots are kept.`)) return;
    run(remove, () => change('DELETE', tickerUrl(ticker.symbol)));
  });
  row.append(toggle, remove);
  return row;
}

const tickerUrl = (symbol) => `/api/tickers/${encodeURIComponent(symbol)}`;

async function change(method, path, body) {
  const response = await fetch(path, {
    method, cache: 'no-store',
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const result = await response.json().catch(() => ({}));
  if (!response.ok) {
    throw Object.assign(new Error(result.error ?? `${method} failed (${response.status})`), { force: result.force === true });
  }
  return result;
}

/** Run one edit from a button, then reload the page data. The buttons are replaced by that reload. */
async function run(button, action) {
  button.disabled = true;
  try {
    flash((await action()).message, 'good');
    await load();
  } catch (error) {
    flash(error.message, 'bad');
    button.disabled = false;
  }
}

let flashTimer = 0;
function flash(message, kind) {
  const box = $('flash');
  box.className = `od-contra message ${kind}`;
  box.replaceChildren(node('span', 'od-contra-label', kind === 'bad' ? 'That did not work' : 'Done'), text(message));
  box.hidden = false;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { box.hidden = true; }, 15_000);
}

// ------------------------------------------------------------------ table
function renderTable() {
  const days = data.target_days;
  const columns = [
    ['Ticker', (t) => t, 'left'],
    ['Status', (t) => t.last_snapshot?.status ?? 'none', 'left'],
    ['Last snapshot', (t) => (t.last_snapshot ? fmt.when(t.last_snapshot.captured_at_utc, '') : null), 'left'],
    ['Spot', (t) => fmt.price(t.spot?.now)],
    ['Spot change', (t) => (t.spot
      ? `${signed(t.spot.now - t.spot.open, 2)} (${signed((t.spot.now / t.spot.open - 1) * 100, 2)}%)` : null)],
    [`${days}-day ATM IV`, (t) => fmt.pct(t.atm?.now), null, 'derived'],
    ['ATM change (pts)', (t) => (t.atm ? fmt.pts(t.atm.now - t.atm.open) : null), null, 'derived'],
    [`${days}-day RR25 (pts)`, (t) => fmt.pts(t.rr25?.now), null, 'derived'],
    ['RR25 change (pts)', (t) => (t.rr25 ? fmt.pts(t.rr25.now - t.rr25.open) : null), null, 'derived'],
    ['RR25/ATM', (t) => fmt.ratio(t.rr25_atm?.now), null, 'derived'],
    ['BF25 (pts)', (t) => fmt.pts(t.bf25?.now), null, 'derived'],
    ['RR10 (pts)', (t) => fmt.pts(t.rr10?.now), null, 'derived'],
    ['Snapshots', (t) => fmt.count(t.stored?.snapshots)],
    ['Expirations', (t) => fmt.count(t.stored?.expirations)],
    ['Quotes', (t) => fmt.count(t.stored?.quotes)],
    ['Actions', () => '', 'left'],
  ];
  const table = $('table');
  table.replaceChildren();
  table.append(node('caption', null, 'Latest day with data per ticker; changes are since that day’s first snapshot. '
    + 'Dotted values are derived from the smile fitted to stored bid/ask mids.'));
  const head = table.createTHead().insertRow();
  for (const [label, , align] of columns) {
    const th = node('th', align ? null : 'od-num', label);
    th.scope = 'col';
    head.append(th);
  }
  const body = table.createTBody();
  for (const ticker of data.tickers) {
    const row = body.insertRow();
    if (!ticker.active) row.className = 'od-flat';
    for (const [label, value, align, status] of columns) {
      const cell = row.insertCell();
      if (!align) cell.className = 'od-num';
      if (status === 'derived') cell.classList.add('od-derived');
      if (label === 'Ticker') {
        if (hasViewer(ticker)) {
          const link = node('a', null, ticker.symbol);
          link.href = viewerUrl(ticker);
          cell.append(link);
          cell.append(text(` ${shortDayFormat.format(new Date(`${ticker.day}T00:00:00Z`))}`));
        } else {
          cell.textContent = ticker.symbol;
        }
      } else if (label === 'Actions') {
        if (!STATIC) cell.append(actions(ticker));
      } else {
        const rendered = value(ticker);
        // The system's only empty value is an em dash, so a missing number never reads as a zero.
        if (rendered == null || rendered === '-') cell.append(nothing());
        else cell.textContent = rendered;
      }
    }
  }
}

// ------------------------------------------------------------------ page
function render() {
  setTimezone(data.timezone);
  const sources = data.sources.map((s) => SOURCE_LABEL[s] ?? s);
  const at = `${timeFormat.format(Date.parse(data.generated_at))} ${tzLabel}`;
  // A written-out copy is read by people who never saw this machine: no file paths, no commands.
  $('subtitle').textContent = (STATIC
    ? [sources.length ? `Option chains from ${sources.map((s) => s.replace(' snapshots', '')).join(' + ')}` : 'no snapshots yet',
      `snapshot of ${fmt.day(localDateFormat.format(Date.parse(data.generated_at)))}, ${at}`]
    : [sources.length ? sources.join(' + ') : 'no snapshots yet', data.database.path,
      `market ${data.market_open ? 'open' : 'closed'}`, `updated ${at}`]).join(' · ');
  $('note').textContent = `${data.target_days}-day values interpolate the two expirations around ${data.target_days} days, `
    + 'read off each chain’s smile fitted to bid/ask mids. ATM IV is the fit at the forward. RR25 is the 25-delta call IV minus the 25-delta put IV, '
    + 'negative when puts are richer. Changes are since the day’s first snapshot. Select a ticker to open its IV surface.'
    + (STATIC ? ' This is a snapshot taken at the time above; it does not update.' : '');

  const message = $('message');
  if (!data.database.exists) {
    message.replaceChildren(
      node('span', 'od-contra-label', 'Nothing collected yet'),
      text(`No database at ${data.database.path} yet. Take a first snapshot with `),
      node('code', null, 'options-db run --once'), text(', or look around with synthetic data: '),
      node('code', null, 'options-db simulate'), text(', then '),
      node('code', null, 'options-db serve --db data/synthetic.db'), text('.'),
    );
    message.hidden = false;
  } else {
    message.hidden = true;
  }
  $('cards').replaceChildren(...data.tickers.map(card));
  renderTable();
  applyView();
}

function applyView() {
  document.querySelectorAll('[data-view]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
  $('cards').hidden = view !== 'cards';
  $('table-view').hidden = view !== 'table';
  // Compact density is for the dense table; the cards keep the comfortable rhythm.
  document.documentElement.dataset.density = view === 'table' ? 'compact' : 'comfortable';
}

// ------------------------------------------------------------------ add dialog
const dialog = $('add-dialog');
let addAnyway = false;  // the yfinance check failed and the user may insist

$('add-open').addEventListener('click', () => {
  const types = data?.asset_types ?? ['equity', 'etf', 'index'];
  $('add-form').reset();
  $('add-type').replaceChildren(...types.map((type) => new Option(type, type, type === 'etf', type === 'etf')));
  if (data?.config_path) $('add-path').textContent = data.config_path;
  setAddStatus('', '');
  dialog.showModal();
  $('add-symbol').focus();
});
$('add-cancel').addEventListener('click', () => dialog.close());
$('add-symbol').addEventListener('input', () => { if (addAnyway) setAddStatus('', ''); });

function setAddStatus(message, kind) {
  addAnyway = kind === 'force';
  $('add-submit').textContent = addAnyway ? 'Add without checking' : 'Check and add';
  const box = $('add-status');
  box.className = `dialog-status${kind === 'force' ? ' bad' : ''}`;
  box.textContent = message;
  box.hidden = !message;
}

$('add-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const submit = $('add-submit');
  const body = {
    symbol: $('add-symbol').value.trim().toUpperCase(),
    type: $('add-type').value,
    yf_symbol: $('add-yf').value.trim(),
    notes: $('add-notes').value.trim(),
    active: $('add-active').checked,
    verify: !addAnyway,
  };
  submit.disabled = true;
  $('add-status').className = 'dialog-status';
  $('add-status').textContent = body.verify
    ? `Checking yfinance for ${body.yf_symbol || body.symbol} options...`
    : `Adding ${body.symbol}...`;
  $('add-status').hidden = false;
  try {
    const result = await change('POST', '/api/tickers', body);
    dialog.close();
    flash(result.message, 'good');
    await load();
  } catch (error) {
    setAddStatus(error.force ? `${error.message} Press again to add it anyway.` : error.message, error.force ? 'force' : 'bad');
    $('add-status').classList.add('bad');
  } finally {
    submit.disabled = false;
  }
});

document.querySelectorAll('[data-view]').forEach((button) => button.addEventListener('click', () => {
  view = button.dataset.view;
  try { localStorage.setItem('options-db-home-view', view); } catch { /* storage blocked */ }
  if (data) applyView();
}));

async function load() {
  document.body.classList.add('refreshing');
  try {
    const response = await fetch('/api/tickers', { cache: 'no-store' });
    const body = await response.json();
    if (!response.ok) throw new Error(body.error ?? response.statusText);
    data = body;
    render();
    document.body.classList.add('loaded');
  } catch (error) {
    const text = `Could not load tickers: ${error.message}`;
    if (data) {
      $('subtitle').textContent = `${text} (showing the last data received)`;
    } else {
      $('subtitle').textContent = text;
    }
  } finally {
    document.body.classList.remove('refreshing');
  }
}

applyView();
if (STATIC) {
  $('add-open').hidden = true;   // nothing to write through
  // options-db site maps each in-app route to the file it wrote; a route it did not write is hidden.
  const links = EMBEDDED.links || {};
  $('dashboards').querySelectorAll('a').forEach((link) => {
    const to = links[link.getAttribute('href')];
    if (to) link.setAttribute('href', to);
    else link.hidden = true;
  });
  render();
} else {
  load();
  setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && data) load(); });
}
</script>
</body>
</html>
